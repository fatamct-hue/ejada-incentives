<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة حوافز الإجادة المؤسسية — معاينة تفاعلية</title>
<style>
@font-face{font-family:"Zarid";src:url("fonts/zarid-regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Zarid";src:url("fonts/zarid-semibold.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Zarid";src:url("fonts/zarid-black.woff2") format("woff2");font-weight:900;font-display:swap}
@font-face{font-family:"Manchette";src:url("fonts/manchette-heavy.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Manchette";src:url("fonts/manchette-medium.woff2") format("woff2");font-weight:500;font-display:swap}
:root{
  --navy:#00253e;--navy-a:#0f446c;--green:#006452;--teal:#00827a;--bluegrey:#6f92b4;--sand:#aa7f67;--grey:#868c8e;
  --cloud:#f0eee9;--sand-a:#e4c6ac;--teal-a:#5eccc9;--green-a:#43b987;--grey-a:#d5d8dd;--cyan:#4ad6ed;
  --sand-b:#ede4df;--teal-b:#c2f2e4;--green-b:#a3f0c2;--bluegrey-b:#afc5d3;--grey-b:#f0f0f0;
  --danger:#b3261e;--danger-b:#fbe4e2;--warn:#8a5a00;--warn-b:#fdf0d5;
  --r:14px;--shadow:0 1px 2px rgba(0,37,62,.06),0 6px 18px rgba(0,37,62,.07);
  --fd:"Manchette","Zarid",Tahoma,sans-serif;--fb:"Zarid",Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cloud);color:var(--navy);font-family:var(--fb);font-size:15px;line-height:1.65}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--teal)}
h1,h2,h3{font-family:var(--fd);font-weight:700;margin:0;line-height:1.35}
.num{font-variant-numeric:tabular-nums}
/* layout */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{background:var(--navy);color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.logo-slot{border:1.5px dashed rgba(255,255,255,.35);border-radius:10px;padding:10px;text-align:center;font-size:12px;color:#afc5d3}
.brand{font-family:var(--fd);font-size:19px;line-height:1.35}
.brand small{display:block;font-family:var(--fb);font-size:12px;color:var(--bluegrey-b);font-weight:400}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;gap:10px;align-items:center;color:#e8eef3;text-decoration:none;padding:9px 10px;border-radius:10px;font-size:14px}
.nav a svg{width:20px;height:20px;flex:none;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:rgba(74,214,237,.14);color:#fff;box-shadow:inset -3px 0 0 var(--cyan)}
.role{background:rgba(255,255,255,.06);border-radius:12px;padding:10px;font-size:13px}
.role label{display:block;color:var(--bluegrey-b);font-size:12px;margin-bottom:4px}
.role select{width:100%;background:#0b3554;border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:8px;padding:7px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--grey-a);position:sticky;top:0;z-index:5}
.topbar h1{font-size:20px;flex:1}
.yr{display:flex;align-items:center;gap:6px;font-size:13px}
.yr select{border:1px solid var(--grey-a);border-radius:8px;padding:5px 8px;background:#fff}
.banner{background:var(--warn-b);color:var(--warn);font-size:13px;padding:8px 24px;border-bottom:1px solid #f1dcae}
.content{padding:22px 24px 90px;max-width:1280px;width:100%}
.mtop{display:none}
/* components */
.card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:18px;position:relative}
.card.ch{clip-path:polygon(0 0,calc(100% - 0px) 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:13px;color:#4c6273}
.kpi .v{font-size:28px;font-weight:900;font-family:var(--fb)}
.kpi .s{font-size:12px;color:#5d7383}
.sec{margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.sec h2{font-size:18px}
.sec .sp{flex:1}
.muted{color:#5d7383}.small{font-size:13px}
.btn{border:0;border-radius:10px;padding:9px 16px;cursor:pointer;background:var(--navy);color:#fff;font-weight:600;display:inline-flex;gap:6px;align-items:center;transition:transform .12s,background .15s}
.btn:active{transform:scale(.97)}
.btn.t{background:var(--teal)}.btn.g{background:var(--green)}.btn.o{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--grey-a)}
.btn.d{background:var(--danger)}.btn.s{padding:6px 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.st-draft{background:var(--grey-b);color:#4f5b60}.st-sent{background:#e1ecf6;color:var(--navy-a)}.st-needs_info{background:var(--warn-b);color:var(--warn)}
.st-review{background:var(--bluegrey-b);color:var(--navy)}.st-recommended{background:var(--teal-b);color:var(--green)}.st-approved{background:var(--green-b);color:var(--green)}
.st-to_pay{background:var(--sand-b);color:#7a5640}.st-paid{background:var(--sand-a);color:#5c3f2e}.st-honored{background:var(--navy);color:#fff}
.tk{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600}
.tk i{width:9px;height:9px;border-radius:3px;display:inline-block}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;text-align:right;color:#4c6273;font-size:12.5px;border-bottom:1.5px solid var(--grey-a);padding:8px 8px;white-space:nowrap;background:#fff;position:sticky;top:0}
td{padding:9px 8px;border-bottom:1px solid #eceae4;vertical-align:top}
tr:hover td{background:#faf9f6}
.tw{overflow:auto;max-height:560px;border-radius:10px}
.flt{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.flt select,.flt input,.inp{border:1px solid var(--grey-a);border-radius:9px;padding:7px 10px;background:#fff;min-width:0}
.alert{border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14px}
.alert.r{background:var(--danger-b);color:#7d1b15}.alert.w{background:var(--warn-b);color:var(--warn)}.alert.i{background:#e1ecf6;color:var(--navy-a)}.alert.ok{background:var(--teal-b);color:var(--green)}
.alert b{font-weight:600}
.bar{height:8px;background:var(--grey-b);border-radius:6px;overflow:hidden;display:flex;justify-content:flex-start}.bar i{display:block;height:100%;border-radius:6px;background:var(--teal);transition:width .6s}
/* form */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.f{display:flex;flex-direction:column;gap:5px}.f.w{grid-column:1/-1}
.f label{font-size:13px;font-weight:600}
.f label .req{color:var(--danger)}
.f .hint{font-size:12px;color:#5d7383}
.f input,.f select,.f textarea{border:1px solid var(--grey-a);border-radius:10px;padding:9px 11px;background:#fff;width:100%}
.f textarea{min-height:82px;resize:vertical}
.f input[readonly]{background:var(--grey-b);color:#4f5b60}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--teal-a);border-color:transparent}
.fs{grid-column:1/-1;font-family:var(--fd);font-size:16px;margin-top:8px;padding-top:12px;border-top:1px solid #eceae4;display:flex;gap:8px;align-items:center}
.ctab{border:1px solid var(--grey-a);border-radius:12px;overflow:hidden}
.cg{border-bottom:1px solid var(--grey-a)}.cg:last-of-type{border-bottom:0}
.cm{background:var(--green);color:#fff;padding:7px 12px;display:flex;gap:8px;font-size:14px}
.cr{display:grid;grid-template-columns:1.3fr 92px 1.2fr;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid #eceae4;font-size:14px}
.ctot{background:var(--teal-b);padding:10px 12px;font-size:15px;color:var(--green)}
@media (max-width:900px){.cr{grid-template-columns:1fr 92px}.cr input{grid-column:1/-1}}
.crit{display:grid;grid-template-columns:1fr 70px 120px;gap:8px;align-items:center;font-size:14px;padding:6px 0;border-bottom:1px dashed #e5e2da}
.crit input[type=range]{width:100%}
/* hero */
.hero{background:linear-gradient(160deg,var(--navy) 0%,var(--navy-a) 100%);color:#fff;border-radius:18px;padding:26px 28px;display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:center;overflow:hidden;position:relative;clip-path:polygon(0 0,100% 0,100% calc(100% - 26px),calc(100% - 26px) 100%,0 100%)}
.hero h2{font-size:30px}
.hero p{color:#d9e5ee;margin:8px 0 16px}
.hero .acts{display:flex;flex-wrap:wrap;gap:8px}
.hero .btn.c{background:var(--cyan);color:var(--navy)}
.hero .btn.o{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4)}
.hero .fig{display:grid;grid-template-columns:repeat(3,auto);justify-content:center;gap:14px}.hero .hic{width:92px;height:92px;border-radius:22px;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.18)}.hero .hic svg{width:58px;height:58px}.hero .hic:nth-child(2){transform:translateY(-14px)}
.trk{border-top:5px solid var(--c);display:flex;flex-direction:column;gap:10px}
.trk .ic{width:52px;height:52px;border-radius:14px;background:var(--cb);display:grid;place-items:center}
.trk .ic svg{width:32px;height:32px}
.trk dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13.5px}
.trk dt{color:#5d7383}.trk dd{margin:0;font-weight:600}
.steps{display:flex;gap:0;overflow:auto;padding-bottom:4px}
.step{flex:1;min-width:120px;text-align:center;position:relative;font-size:13px;padding:0 4px}
.step .dot{width:34px;height:34px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--teal-b);color:var(--green);font-weight:900;position:relative;z-index:1}
.step:not(:last-child)::after{content:"";position:absolute;top:17px;left:-50%;width:100%;height:2px;background:var(--teal-b)}
.todo{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eceae4}
.todo:last-child{border:0}
.todo .n{font-size:22px;font-weight:900;min-width:44px;text-align:center}
/* charts */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;margin-top:6px}
.legend span{display:inline-flex;gap:6px;align-items:center}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* modal */
.mdl{position:fixed;inset:0;background:rgba(0,37,62,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.mdl.on{display:flex;animation:fd .15s}
.mdl .box{background:#fff;border-radius:16px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:22px;animation:up .2s}
.mdl .box h3{font-size:19px;margin-bottom:10px}
.mdl .ft{display:flex;gap:8px;justify-content:flex-start;margin-top:16px;flex-wrap:wrap}
@keyframes fd{from{opacity:0}}@keyframes up{from{transform:translateY(12px);opacity:0}}
.fadein{animation:up .25s ease-out}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:12px;padding:10px 18px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.audit{font-size:13px;border-right:2px solid var(--teal-b);padding-right:12px;margin-top:6px}
.audit div{padding:4px 0}
.tag{font-size:11px;border-radius:6px;padding:1px 6px;background:var(--sand-b);color:#7a5640;margin-inline-start:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:0;background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--grey-a);font-weight:600;font-size:13.5px}
.tabs button.on{background:var(--navy);color:#fff;box-shadow:none}
.cert{aspect-ratio:1.414;background:#fff;border-radius:6px;position:relative;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6%;color:var(--navy)}
.cert::before{content:"";position:absolute;inset:14px;border:2px solid var(--cyan);clip-path:polygon(0 0,calc(100% - 40px) 0,100% 40px,100% 100%,40px 100%,0 calc(100% - 40px))}
.cert .lg{position:absolute;top:22px;right:26px;border:1px dashed var(--grey);font-size:10px;padding:6px 10px;border-radius:6px;color:var(--grey)}
.cert h4{font-family:var(--fd);font-size:28px;margin:0 0 8px}
.cert .nm{font-family:var(--fd);font-size:26px;color:var(--teal);margin:10px 0}
.empty{text-align:center;color:#5d7383;padding:28px 10px}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--grey-b);border-radius:8px;padding:3px 9px;font-size:12.5px;margin:2px}
.bnav{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .side.open{display:flex;position:fixed;inset:0 0 0 auto;width:82vw;max-width:320px;z-index:40;height:100vh}
  .mtop{display:inline-flex}
  .topbar{padding:10px 14px}.topbar h1{font-size:17px}
  .content{padding:14px 12px 96px}
  .banner{padding:7px 14px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .g4.k{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr;padding:20px}.hero h2{font-size:23px}.hero .fig{display:none}
  .kpi .v{font-size:23px}
  .crit{grid-template-columns:1fr 54px 90px}
  .bnav{display:flex;position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--grey-a);z-index:30;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav a{display:flex;flex-direction:column;align-items:center;font-size:11px;color:#4c6273;text-decoration:none;gap:2px;min-width:56px}
  .bnav a svg{width:22px;height:22px}
  .bnav a.on{color:var(--teal);font-weight:600}
  .rtable thead{display:none}
  .rtable tr{display:block;border-bottom:1px solid var(--grey-a);padding:8px 0}
  .rtable td{display:flex;justify-content:space-between;gap:10px;border:0;padding:3px 4px}
  .rtable td::before{content:attr(data-l);color:#5d7383;font-size:12.5px}
  .tw{max-height:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="logo-slot">مكان الشعار الرسمي للوزارة<br>(يُضاف من ملفات الهوية المعتمدة)</div>
    <div class="brand">منصة حوافز الإجادة المؤسسية<small>وزارة الإسكان والتخطيط العمراني</small></div>
    <div class="role">
      <label>الدور (للمعاينة فقط)</label>
      <select id="roleSel"></select>
      <div class="small" id="roleNote" style="margin-top:6px;color:#afc5d3"></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div style="flex:1"></div>
    <div class="small" style="color:#8fa8bb">فريق الإجادة المؤسسية في وزارة الإسكان والتخطيط العمراني</div>
  </aside>
  <div class="main">
    <div class="topbar">
      <button class="btn o s mtop" id="menuBtn" aria-label="القائمة">☰</button>
      <h1 id="title">الرئيسية</h1>
      <div class="yr">السنة <select id="yearSel"></select></div>
    </div>
    <div class="banner" id="banner" style="display:none"></div>
    <div class="content" id="view"></div>
  </div>
</div>
<nav class="bnav" id="bnav"></nav>
<div class="mdl" id="mdl"><div class="box" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============ ICONS ============ */
const IC={
home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
unit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21V7l8-4 8 4v14M9 21v-5h6v5M8 10h.01M12 10h.01M16 10h.01M8 13h.01M16 13h.01"/></svg>',
form:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h5"/></svg>',

review:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5M8.5 11l2 2 3.5-4"/></svg>',
money:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v.01M18 14.5v.01"/></svg>',

gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>',

/* track icons (custom) */

/* ============ CALCULATIONS ============ */
function yNoms(){return S.noms.filter(n=>n.year===S.year)}
function participating(){return S.units.filter(u=>!u.inParent)}
function budget(){
 const cfg=yearCfg(S.year);
 const total=cfg.approvedTotal*RATE;
 const mob=Math.max(0,total-BS_FIXED_TOTAL-INV_TOTAL);
 const units=participating();
 const empSum=units.reduce((a,u)=>a+(+u.employees||0),0);
 // القيمة المرجعية = المتبقي ÷ عدد الموظفين، ومخصص التقسيم = القيمة × عدد موظفيه (بالبيسة)، وتُوزَّع فروق التقريب بالباقي الأكبر
 const mobB=Math.round(mob*1000);
 const raw=units.map(u=>({u,exact:empSum?mobB*u.employees/empSum:0}));
 raw.forEach(r=>{r.base=Math.floor(r.exact);r.rem=r.exact-r.base});
 let left=mobB-raw.reduce((a,r)=>a+r.base,0);
 [...raw].sort((a,b)=>b.rem-a.rem).forEach(r=>{if(left>0){r.base++;left--}});
 const alloc={};raw.forEach(r=>alloc[r.u.id]=r.base/1000);
 return {total,mob,empSum,approvedTotal:cfg.approvedTotal,perEmp:empSum?mob/empSum:0,alloc,diff:empSum-cfg.approvedTotal};
}
function unitMoney(uid){
 const b=budget();const ns=yNoms().filter(n=>n.track==="mob"&&n.unitId===uid);
 const byQ={Q1:0,Q2:0,Q3:0,Q4:0};let paid=0,committed=0,pending=0;
 ns.forEach(n=>{
  if(APPROVED_SET.has(n.status)){byQ[n.cycle]+=n.amount;if(n.status==="paid"||n.status==="honored")paid+=n.amount;else committed+=n.amount}
  else if(["sent","review","recommended"].includes(n.status))pending+=(n.proposed||0);
 });
 const approved=byQ.Q1+byQ.Q2+byQ.Q3+byQ.Q4;
 return {alloc:b.alloc[uid]||0,byQ,approved,paid,committed,pending,balance:(b.alloc[uid]||0)-approved};
}
function conflicts(){
 const map={};
 yNoms().filter(n=>n.track!=="inv"||true).forEach(n=>{
  const ids=n.track==="inv"?(n.members||[]).map(m=>m.empNo):[n.emp.empNo];
  ids.forEach(e=>{if(!e)return;(map[e]=map[e]||[]).push(n)});
 });
 const out=[];
 Object.entries(map).forEach(([e,list])=>{
  const tracks=new Set(list.map(n=>n.track));
  if(tracks.size>1){
   const appr=new Set(list.filter(n=>APPROVED_SET.has(n.status)).map(n=>n.track));
   out.push({empNo:e,list,severe:appr.size>1});
  }
 });
 return out;
}
function approvedInOtherTrack(n){
 const ids=n.track==="inv"?(n.members||[]).map(m=>m.empNo):[n.emp.empNo];
 return yNoms().find(x=>x.id!==n.id&&x.track!==n.track&&APPROVED_SET.has(x.status)&&(x.track==="inv"?(x.members||[]).some(m=>ids.includes(m.empNo)):ids.includes(x.emp.empNo)));
}
function bsWinner(uid,cyc,except){return yNoms().find(n=>n.track==="bs"&&n.unitId===uid&&n.cycle===cyc&&APPROVED_SET.has(n.status)&&n.id!==except)}

 participating().forEach(u=>{const m=unitMoney(u.id);if(m.balance<0)a.push({lvl:"r",t:"تجاوز مالي",d:u.short+": المعتمد "+fm(m.approved)+" يتجاوز المخصص "+fm(m.alloc)})});

/* ============ CHARTS (SVG) ============ */
function niceStep(m){const r=m/4;const p=Math.pow(10,Math.floor(Math.log10(r||1)));const f=r/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function barChart(cats,series,{h=220,stack=false}={}){
 const W=600,pad={l:12,r:44,t:20,b:44};const iw=W-pad.l-pad.r,ih=h-pad.t-pad.b;
 const max=Math.max(1,...cats.map((_,i)=>stack?series.reduce((a,s)=>a+s.v[i],0):Math.max(...series.map(s=>s.v[i]))));
 const step=Math.max(1,niceStep(max));const nice=step*Math.ceil(max/step);const gw=iw/cats.length;const bw=stack?Math.min(46,gw*.55):Math.min(26,gw*.7/series.length);
 let g="";for(let k=0;k*step<=nice+1e-9;k++){const y=pad.t+ih-ih*k*step/nice;g+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y}" y2="${y}" stroke="#e8e5de"/><text x="${W-pad.r+8}" y="${y+4}" font-size="11" text-anchor="start" fill="#5d7383">${fn(k*step)}</text>`}
 cats.forEach((c,i)=>{const cx=W-pad.r-gw*i-gw/2;let acc=0;
  series.forEach((s,j)=>{const v=s.v[i];const bh=ih*v/nice;let x,y;
   if(stack){x=cx-bw/2;y=pad.t+ih-acc-bh;acc+=bh}else{x=cx+bw*series.length/2-(j+1)*bw;y=pad.t+ih-bh}
   g+=`<rect x="${x+1}" y="${y}" width="${bw-2}" height="${Math.max(0,bh)}" rx="3" fill="${s.c}"><title>${esc(s.n)}: ${fn(v)}</title></rect>`;
   if(!stack&&v)g+=`<text x="${x+bw/2}" y="${y-4}" font-size="10.5" text-anchor="middle" fill="#00253e">${fn(v)}</text>`});
  if(stack){const tot=series.reduce((a,s)=>a+s.v[i],0);if(tot)g+=`<text x="${cx}" y="${pad.t+ih-acc-5}" font-size="11" text-anchor="middle" font-weight="700" fill="#00253e">${fn(tot)}</text>`}
  g+=`<text x="${cx}" y="${h-pad.b+16}" font-size="11.5" text-anchor="middle" fill="#00253e">${esc(c)}</text>`});
 return `<div class="chart"><svg viewBox="0 0 ${W} ${h}" role="img">${g}</svg><div class="legend">${series.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join("")}</div></div>`;
}
function hbars(rows,{c="#00827a"}={}){
 const max=Math.max(1,...rows.map(r=>r[1]));
 return rows.map(r=>`<div style="display:grid;grid-template-columns:120px 1fr 64px;gap:8px;align-items:center;font-size:13px;margin:5px 0"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r[0])}</span><div class="bar" style="height:12px"><i style="width:${r[1]/max*100}%;background:${r[2]||c}"></i></div><span class="num" style="text-align:left">${r[3]||fn(r[1])}</span></div>`).join("");
}

function calcScore(){const f=$("#frm");if(!f||!f.sc0)return;let s=0,all=true;for(let i=0;i<NSUB;i++){const v=f["sc"+i].value;if(v==="")all=false;else s+=+v}const el=$("#wscore");if(el)el.textContent=s+(all?"":" (غير مكتمل)")}
function chkAmt(bal){const v=+$("#frm").proposed.value;const h=$("#amtHint");if(v>bal){h.style.color="var(--danger)";h.textContent="يتجاوز الرصيد المتاح ("+fm(bal)+")"}else{h.style.color="";h.textContent="ضمن الرصيد المتاح"}}
function saveForm(mode){
 const f=$("#frm");const u=unit(S.role.unitId);const isBS=cur()==="bsform";
 const g=k=>f[k]?f[k].value.trim():"";
 if(mode!=="draft"){
  const req=isBS?["name","title","empNo","justification","supervisor"]:["name","title","empNo","initiative","justification","proposed","supervisor"];
  const miss=req.filter(k=>!g(k));if(miss.length){toast("أكمل الحقول المطلوبة (*) قبل الإرسال");f[miss[0]].focus();return}
  for(let i=0;i<NSUB;i++)if(f["sc"+i].value===""){toast("أكمل درجات جميع المعايير الفرعية");f["sc"+i].focus();return}
  const prevN=editId&&S.noms.find(x=>x.id===editId);if(!((prevN&&prevN.evidence||[]).length||($("#fEv").files||[]).length)){toast("أرفق شاهداً واحداً على الأقل");return}
  if(!isBS){const m=unitMoney(u.id);const prev=editId&&S.noms.find(x=>x.id===editId);const own=prev&&["sent","review","recommended"].includes(prev.status)?(prev.proposed||0):0;if(+g("proposed")>m.balance+own){toast("المبلغ المقترح يتجاوز الرصيد السنوي المتاح للتقسيم ("+fm(m.balance)+")");return}}
 }
 let n=editId&&S.noms.find(x=>x.id===editId);
 const evs=[...(($("#fEv")||{}).files||[])].map(x=>x.name);
 if(!n){n=mkNom({track:isBS?"bs":"mob",cycle:g("cycle"),unitId:u.id,createdAt:today(),preparedBy:who(),demo:false,emp:{}});n.audit=[{at:today(),by:who(),act:"إنشاء السجل",to:"draft"}];S.noms.push(n)}
 n.cycle=g("cycle");n.emp={name:g("name"),empNo:g("empNo"),title:g("title"),outlet:isBS?g("outlet"):""};n.evidence=(n.evidence||[]).concat(evs);n.dept=g("dept");n.supervisor=g("supervisor");n.justification=g("justification");n.scores=Array.from({length:NSUB},(_,i)=>f["sc"+i].value===""?"":+f["sc"+i].value);n.scoreEv=Array.from({length:NSUB},(_,i)=>f["ev"+i].value.trim());
 
 if(!isBS){n.initiative=g("initiative");n.benef=g("benef");n.execDate=g("execDate");n.proposed=+g("proposed")||0;
}
 if(mode==="draft"){log(n,"حفظ مسودة");toast("حُفظت المسودة")}

 if(mode==="send"){n.approvedBy=who();const wasNI=n.status==="needs_info";log(n,wasNI?"استكمال وإعادة إرسال":"اعتماد المدير العام وإرسال","sent");n.returnReason="";toast("أُرسل الترشيح — يظهر الآن لدى الفريق المركزي وجهة الإشراف")}

 <div class="sec"><h2>التقسيمات وأعداد الموظفين</h2><span class="sp"></span><span class="small muted">قائمة التقسيمات تجريبية وتُستبدل بالهيكل المعتمد من الموارد البشرية</span></div>
 ${b.diff?`<div class="alert w" style="margin-bottom:10px">${IC.warn}<div>المجموع ${fn(b.empSum)} ≠ العدد المعتمد ${fn(b.approvedTotal)}</div></div>`:""}
 <div class="card tw"><table class="rtable"><thead><tr><th>التقسيم</th><th>النوع</th><th>التقسيم الأعلى</th><th>الموظفون</th><th>محسوب ضمن الأعلى</th><th>المسارات</th></tr></thead><tbody>
 ${S.units.map((u,i)=>`<tr><td data-l="التقسيم">${esc(u.name)}</td><td data-l="النوع" class="small">${{regional:"مديرية إقليمية",customer:"دائرة خدمة المراجعين",service:"جهة خدمة مستفيدين",central:"مركزي",office:"مكتب"}[u.type]}</td><td data-l="الأعلى" class="small">${u.parent?esc(unit(u.parent).short):"—"}</td><td data-l="الموظفون"><input class="inp num" style="width:90px" type="number" value="${u.employees}" onchange="S.units[${i}].employees=+this.value;render()"></td><td data-l="ضمن الأعلى">${u.parent?`<input type="checkbox" ${u.inParent?"checked":""} onchange="S.units[${i}].inParent=this.checked;render()">`:"—"}</td><td data-l="المسارات" class="small"><label style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" ${bsEligible(u)?"checked":""} ${u.type==="regional"||u.type==="customer"?"disabled":""} onchange="S.units[${i}].bs=this.checked;render()">خدمة المستفيدين</label> · المبادر</td></tr>`).join("")}</tbody></table></div>
 <div class="sec"><h2>المستخدمون</h2><span class="sp"></span><button class="btn s" onclick="userForm()">إضافة مستخدم</button></div>
 <div class="card tw"><table class="rtable"><thead><tr><th>الاسم</th><th>البريد الإلكتروني</th><th>الدور</th><th>التقسيم</th><th></th></tr></thead><tbody>${S.users.map((x,i)=>`<tr><td data-l="الاسم">${esc(x.name)}</td><td data-l="البريد" class="num">${esc(x.email)||"—"}</td><td data-l="الدور">${ROLE_NAMES[x.role]}</td><td data-l="التقسيم">${x.unitId?esc(unit(x.unitId).name):"—"}</td><td><button class="btn o s" onclick="S.users.splice(${i},1);render()">حذف</button></td></tr>`).join("")}</tbody></table></div>
 <p class="small muted">كل مدير عام يُربط بتقسيمه هنا، فيدخل بالبريد ويظهر له تقسيمه تلقائياً.</p>
 <div class="sec"><h2>سجل الموظفين</h2></div>
 <div class="card"><p class="small" style="margin-top:0">${S.employees.length?fn(S.employees.length)+" موظفاً مسجلاً":"لم يُستورد سجل الموظفين بعد"}. عند الاستيراد يكتب المدير العام الرقم الوظيفي فيظهر الاسم والمسمى تلقائياً، ويتحقق النظام أن الموظف من تقسيمه.</p>
 <p class="small muted">الصق من Excel بالترتيب: الرقم الوظيفي، الاسم، المسمى الوظيفي، رمز التقسيم.</p><textarea id="empimp" class="inp" style="width:100%;min-height:80px"></textarea><div class="flt" style="margin-top:8px"><button class="btn" onclick="importEmps()">استيراد</button></div></div>
 <div class="sec"><h2>الصلاحيات</h2></div>
 <div class="card small tw"><table class="rtable"><thead><tr><th>الدور</th><th>يرى</th><th>يستطيع</th></tr></thead><tbody>

 <tr><td data-l="الدور"><b>المدير العام / المسؤول الأعلى</b></td><td data-l="يرى">تقسيمه فقط</td><td data-l="يستطيع">اعتماد وإرسال الترشيحات وتحديد مبالغ المبادر ضمن الرصيد</td></tr>
 <tr><td data-l="الدور"><b>م.ع للتطوير والدراسات</b></td><td data-l="يرى">خدمة المستفيدين والمبتكر</td><td data-l="يستطيع">اعتماد ترشيحات خدمة المستفيدين ونتائج المبتكر، أو إعادتها للاستكمال</td></tr><tr><td data-l="الدور"><b>م.ع للشؤون الإدارية والمالية</b></td><td data-l="يرى">المبادر، والمعتمد من جميع المسارات للصرف</td><td data-l="يستطيع">اعتماد ترشيحات المبادر، والإحالة للصرف وتسجيله</td></tr>
 <tr><td data-l="الدور"><b>الفريق المركزي</b></td><td data-l="يرى">جميع التقسيمات</td><td data-l="يستطيع">استلام الترشيحات ومراجعتها والتوصية، حسم التعارضات، إدخال نتائج نبتكر، الإعدادات والمستخدمون، الإقفال، اعتماد نسخ النشر، تسجيل التكريم</td></tr></tbody></table></div>
 <div class="sec"><h2>بيانات العرض التجريبي</h2></div>
 <div class="card flt"><span style="flex:1">${S.noms.filter(n=>n.demo).length} سجلاً تجريبياً · ${S.noms.filter(n=>!n.demo).length} سجلاً أدخلته في هذه الجلسة</span><button class="btn o" onclick="if(!S.noms.some(n=>n.demo)){seedNoms();toast('حُمّلت بيانات تجريبية للعرض')}render()">تحميل بيانات تجريبية</button><button class="btn d" onclick="S.noms=S.noms.filter(n=>!n.demo);toast('حُذفت البيانات التجريبية فقط');render()">حذف البيانات التجريبية</button></div>`;
};

const ROLE_NAMES={central:"فريق الإجادة المؤسسية",dev:"م.ع للتطوير والدراسات",adm:"م.ع للشؤون الإدارية والمالية",dg:"مدير عام / مسؤول أعلى"};
function userForm(){modal(`<h3>إضافة مستخدم</h3><div class="form"><div class="f"><label>الاسم</label><input id="un"></div><div class="f"><label>البريد الإلكتروني الحكومي</label><input id="ue" type="email" dir="ltr"></div>
 <div class="f"><label>الدور</label><select id="ur" onchange="document.getElementById('uuw').style.display=this.value==='dg'?'':'none'">${Object.entries(ROLE_NAMES).map(([k,v])=>`<option value="${k}" ${k==="dg"?"selected":""}>${v}</option>`).join("")}</select></div>
 <div class="f" id="uuw"><label>التقسيم</label><select id="uu">${participating().map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("")}</select></div></div>
 <div class="ft"><button class="btn g" onclick="saveUser()">إضافة</button><button class="btn o" onclick="closeModal()">إلغاء</button></div>`)}
function saveUser(){const name=$("#un").value.trim(),email=$("#ue").value.trim(),role=$("#ur").value;if(!name||!/^\S+@\S+\.\S+$/.test(email)){toast("أدخل الاسم وبريداً صحيحاً");return}
 if(role==="dg"&&S.users.some(x=>x.role==="dg"&&x.unitId===$("#uu").value)){toast("هذا التقسيم مرتبط بمدير عام مسجل");return}
 S.users.push({name,email,role,unitId:role==="dg"?$("#uu").value:""});closeModal();render()}
function importEmps(){const lines=$("#empimp").value.split("\n").map(l=>l.trim()).filter(Boolean);let ok=0,bad=0;
 lines.forEach(l=>{const p=l.split(/\t|,|،/).map(x=>x.trim());const u=S.units.find(x=>x.id===p[3]||x.name===p[3]||x.short===p[3]);if(p.length<4||!p[0]||!u){bad++;return}
  const e=S.employees.find(x=>x.empNo===p[0]);const rec={empNo:p[0],name:p[1],title:p[2],unitId:u.id};if(e)Object.assign(e,rec);else S.employees.push(rec);ok++});
 toast("استُورد "+ok+(bad?" — تعذّر "+bad+" سطراً":""));render()}
function empLookup(el){const e=S.employees.find(x=>x.empNo===el.value.trim());const f=$("#frm");const h=document.getElementById("empHint");if(!e){if(h)h.textContent=S.employees.length?"الرقم غير موجود في سجل الموظفين":"";return}
 if(e.unitId!==S.role.unitId){if(h)h.textContent="الموظف ليس من تقسيمك";return}f.name.value=e.name;f.title.value=e.title;if(h)h.textContent="✓ "+e.name}
/* ============ RENDER ============ */
function render(){
 const k=cur();buildNav();$("#title").textContent=ROUTES[k][0];
 const v=$("#view");v.innerHTML=V[k]();v.classList.remove("fadein");void v.offsetWidth;v.classList.add("fadein");
 countUp(v);if(k==="mobform")calcScore();
 $("#side").classList.remove("open");window.scrollTo(0,0);
}
window.addEventListener("hashchange",()=>{if(!/form/.test(cur()))editId=null;render()});
$("#menuBtn").onclick=()=>$("#side").classList.toggle("open");
$("#yearSel").innerHTML=[2026,2027].map(y=>`<option ${y===S.year?"selected":""}>${y}</option>`).join("");
$("#yearSel").onchange=e=>{S.year=+e.target.value;yearCfg(S.year);render()};
yearCfg(2026);buildRoles();if(!location.hash)location.hash="home";render();
</script>
</body>
</html>
